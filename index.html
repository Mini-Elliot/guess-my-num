      <div class="main-title">
        Guess My <span class="number-text">Number!</span>
      </div>
      <div class="subtitles">
        <p class="subtitle" id="hint">
          I am thinking of a number between 1 and 20.
        </p>
        <p class="subtitle" id="message">Can you Guess it?</p>
      </div>
      <div class="form-and-score">
        <form class="game-form">
          <input type="number" name="guess" id="guess" />
          <button type="button" class="btn btn--main">Check!</button>
        </form>
        <aside class="scoreboard">
          <div class="score">
            <h2 class="small-uppercase-labels">🎯 Score</h2>
            <h3 class="score__value">20</h3>
          </div>
          <div class="divider"></div>
          <div class="high-score">
            <h2 class="small-uppercase-labels">🏆 High Score</h2>
            <h3 class="high-score__value">0</h3>
          </div>
        </aside>
      </div>
